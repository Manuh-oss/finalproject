<!DOCTYPE html>
<html>
<head>
  <title>Rainbow Font Awesome Icon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: rgba(0,0, 0, .3);
}

/* Loader styling */
#loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0, 0, .3);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.6s ease;
    z-index: 9999;
}

.loader-img {
    width: 120px;
    animation: zoomPulse 1.5s infinite ease-in-out;
}

#loader p {
    margin-top: 15px;
    font-size: 1.2rem;
    color: #333;
}

/* Zoom + Pulse Animation */
@keyframes zoomPulse {
    0% {
        transform: scale(0.9);
        filter: brightness(95%);
    }
    50% {
        transform: scale(1.1);
        filter: brightness(105%);
    }
    100% {
        transform: scale(0.9);
        filter: brightness(95%);
    }
}


  </style>
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <img src="images/images (4).png" alt="School Logo" class="loader-img">
        <p>Loading your classroom...</p>
    </div>

    <!-- Page Content -->
    <div id="content" style="display:none;">
        <h1>Welcome to Our School</h1>
        <p>Page content goes here...</p>
    </div>

    </script>
</body>


</html>
